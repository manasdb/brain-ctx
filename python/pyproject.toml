[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-ctx"
version = "1.0.0"
description = "brain.ctx — AI Constitution Standard. Self-maintaining project intelligence for every AI tool, agent, and model."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Bomberedman", email = "hello@manasdb.com" }]
keywords = ["ai", "agents", "llm", "context", "brain-ctx", "manasdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "gitpython>=3.1",
    "typer>=0.9",
    "rich>=13.0",
    "anthropic>=0.25",
    "tree-sitter>=0.21",
    "pathspec>=0.12",
    "tomllib; python_version < '3.11'",
]

[project.optional-dependencies]
signing = ["PyNaCl>=1.5"]
dev     = ["pytest>=7", "pytest-cov", "black", "ruff", "mypy"]

[project.scripts]
brain-ctx = "brain_ctx.cli:app"

[project.urls]
Homepage   = "https://manasdb.com"
Repository = "https://github.com/manasdb/brain-ctx"
Issues     = "https://github.com/manasdb/brain-ctx/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain_ctx*"]

[tool.setuptools.package-data]
brain_ctx = ["spec/*.json", "spec/*.yaml"]
