name: brain-ctx CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Python library ─────────────────────────────────────────
  python:
    name: Python Library
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python library
        working-directory: python
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: python
        run: ruff check brain_ctx/

      - name: Type check (mypy)
        working-directory: python
        run: mypy brain_ctx/ --ignore-missing-imports

      - name: Run tests
        working-directory: python
        run: pytest tests/ -v --cov=brain_ctx --cov-report=xml

      - name: Validate ManasDB example brain.ctx
        working-directory: python
        run: brain-ctx validate ../examples/manasdb/brain.ctx

  # ── Node library ───────────────────────────────────────────
  node:
    name: Node Library
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install Node library
        working-directory: node
        run: npm ci

      - name: Type check
        working-directory: node
        run: npm run typecheck

      - name: Build
        working-directory: node
        run: npm run build

      - name: Run tests
        working-directory: node
        run: npm test

  # ── Spec validation ────────────────────────────────────────
  spec:
    name: Spec Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON Schema is valid
        run: |
          python -c "
          import json, jsonschema
          schema = json.load(open('spec/brain-ctx.schema.json'))
          jsonschema.Draft7Validator.check_schema(schema)
          print('✓ JSON Schema is valid')
          "

      - name: Validate all example brain.ctx files
        run: |
          pip install pyyaml jsonschema
          python -c "
          import yaml, json, jsonschema, pathlib
          schema = json.load(open('spec/brain-ctx.schema.json'))
          for f in pathlib.Path('examples').rglob('brain.ctx'):
              data = yaml.safe_load(f.read_text())
              try:
                  jsonschema.validate(data, schema)
                  print(f'✓ {f}')
              except jsonschema.ValidationError as e:
                  print(f'✗ {f}: {e.message}')
                  exit(1)
          "

  # ── Cross-library compatibility ────────────────────────────
  compat:
    name: Cross-Library Compatibility
    needs: [python, node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install both libraries
        run: |
          pip install -e python/[dev]
          cd node && npm ci && npm run build

      - name: Python generates, Node reads
        run: |
          cd /tmp
          mkdir test-project && cd test-project
          git init && echo "# Test" > README.md
          cat > package.json << 'EOF'
          {"name": "test-project", "description": "Testing brain.ctx compatibility"}
          EOF
          brain-ctx init --silent
          node -e "
          const { BrainCtx } = require('$GITHUB_WORKSPACE/node/dist/index.js')
          const ctx = BrainCtx.load('brain.ctx')
          console.log('Node read:', ctx.aiScore().raw)
          console.assert(ctx.name === 'Test Project', 'Name mismatch')
          console.log('✓ Cross-library compatibility confirmed')
          "
